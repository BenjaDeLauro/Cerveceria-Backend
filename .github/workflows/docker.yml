name: Verificar Docker

on:
  push:
    branches: [feature/docker]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar configuración local de prueba
        run: cp .env.example .env
      - name: Validar Compose y construir la imagen
        run: |
          docker compose config --quiet
          docker compose build
      - name: Comprobar Django, migraciones y pruebas dentro del contenedor
        run: |
          docker compose run --rm web python manage.py check
          docker compose run --rm web python manage.py makemigrations --check --dry-run
          docker compose run --rm web python manage.py test
      - name: Iniciar servidor y comprobar HTTP
        run: |
          docker compose up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/catalogo/productos/
          curl --fail http://127.0.0.1:8000/api/productos/
          curl --fail http://127.0.0.1:8000/static/css/tienda.css
          curl --fail http://127.0.0.1:8000/admin/login/
      - name: Comprobar persistencia al recrear el contenedor
        run: |
          docker compose exec -T web python manage.py cargar_catalogo_demo
          docker compose exec -T web python manage.py shell -c "from pathlib import Path; from django.conf import settings; (Path(settings.MEDIA_ROOT) / 'persistencia.txt').write_text('efi')"
          docker compose up -d --force-recreate --wait --wait-timeout 90
          docker compose exec -T web python manage.py shell -c "from pathlib import Path; from django.conf import settings; from catalogo.models import Producto; assert Producto.objects.filter(nombre__startswith='ImperioSur ').count() == 3; assert (Path(settings.MEDIA_ROOT) / 'persistencia.txt').read_text() == 'efi'"
      - name: Mostrar logs y detener los contenedores de prueba
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
