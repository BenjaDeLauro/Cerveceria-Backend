{% load static %}
<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ImperioSur · Backend{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tienda.css' %}">
</head>
<body>
  <nav aria-label="Navegación del backend">
    <a href="{% url 'inicio' %}">Inicio</a>
    {% if user.is_authenticated %}
      <form action="{% url 'usuarios:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
      </form>
    {% else %}
      <a href="{% url 'usuarios:login' %}">Ingresar</a>
      <a href="{% url 'usuarios:registro' %}">Registrarse</a>
    {% endif %}
  </nav>
  <main>
    {% if messages %}
      <div role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
